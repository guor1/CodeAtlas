[package]
name = "codeatlas"
version = "0.1.0"
edition = "2024"

# 包名是 codeatlas（库 + 项目），可执行文件名是 catlas。
[[bin]]
name = "catlas"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-java = "0.23.5"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
